<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Starting Basement Band</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #191a1e;
        color: #f4f4f6;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      .mark {
        color: #dba466;
        font-size: 48px;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 27px;
        letter-spacing: -1px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      p {
        color: #aaaab5;
        margin: 0 0 30px;
      }
      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 2px solid #38383f;
        border-top-color: #dba466;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">♫</div>
      <h1>Basement Band</h1>
      <p>Getting your recording room ready…</p>
      <span class="spinner" aria-hidden="true"></span>
    </main>
  </body>
</html>
